name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: authkit
          POSTGRES_PASSWORD: authkit
          POSTGRES_DB: authkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://authkit:authkit@localhost:5432/authkit_test
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: authkit
          POSTGRES_PASSWORD: authkit
          POSTGRES_DB: authkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: authkit-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: |
          docker run -d --name authkit-smoke --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://authkit:authkit@localhost:5432/authkit \
            -e JWT_ACCESS_SECRET=smoke-test-secret-that-is-at-least-32-chars \
            -e GOOGLE_CLIENT_ID=smoke-google-client-id \
            -e GOOGLE_CLIENT_SECRET=smoke-google-client-secret \
            -e GOOGLE_REDIRECT_URI=https://smoke.example.com/auth/google/callback \
            authkit-api:smoke
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health; then
              echo "Health check passed after ${i}s"
              exit 0
            fi
            echo "Attempt $i/60…"
            sleep 1
          done
          echo "Health check timed out after 60s"
          docker logs authkit-smoke
          exit 1
      - name: Stop container
        if: always()
        run: docker stop authkit-smoke && docker rm authkit-smoke
